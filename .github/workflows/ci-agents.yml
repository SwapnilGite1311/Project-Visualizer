name: ci-agents
on:
  push:
    branches: [main]
    paths: ['agents/**']
  pull_request:
    paths: ['agents/**']
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        working-directory: agents/python
        run: uv sync
      - name: Test
        working-directory: agents/python
        run: uv run pytest -q
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: agents/node
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: agents/node
        run: pnpm test
