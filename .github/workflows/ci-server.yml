name: ci-server
on:
  push:
    branches: [main]
    paths: ['server/**']
  pull_request:
    paths: ['server/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck and test every library and service
        shell: bash
        run: |
          set -e
          for d in server/libs/* server/services/*; do
            if [ -f "$d/package.json" ]; then
              echo "== $d"
              (cd "$d" && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test)
            fi
          done
