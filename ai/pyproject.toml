[project]
name = "pv-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pinecone>=5",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.11",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pv_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
