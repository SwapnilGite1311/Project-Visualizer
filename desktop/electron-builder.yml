appId: com.projectvisualizer.app
productName: Project Visualizer
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  extraResources:
    - from: ../engine/build/app/Release/pv-engine.exe
      to: engine/pv-engine.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.developer-tools
  extraResources:
    - from: ../engine/build-release/app/pv-engine
      to: engine/pv-engine
linux:
  target: AppImage
  category: Development
  extraResources:
    - from: ../engine/build-release/app/pv-engine
      to: engine/pv-engine
publish:
  provider: github
  owner: SwapnilGite1311
  repo: Project-Visualizer
  releaseType: release
