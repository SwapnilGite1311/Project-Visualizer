services:
  ai:
    build:
      context: ../..
      dockerfile: ai/Dockerfile
    env_file: [../../ai/.env.docker]
    ports: ["8200:8200"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/healthz')"], interval: 10s, retries: 10 }
